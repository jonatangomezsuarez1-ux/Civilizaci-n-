<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V6 Debug</title>
<style>
body{background:#0b1118;color:#fff;padding:10px;font-family:system-ui;font-size:14px}
h1{font-size:17px;margin:5px 0}
button{padding:8px 12px;margin:3px;background:#1a2b40;color:#fff;border:1px solid #2c4666;border-radius:8px}
button.danger{background:#4a1e26}
canvas{background:#111;display:block;width:100%;max-width:500px;margin:8px auto;border-radius:8px}
.info{background:#111c2a;border:1px solid #22344a;border-radius:10px;padding:8px;margin:6px 0;font-size:13px}
.npc{padding:6px;border:1px solid #22344a;border-radius:8px;margin:5px 0;background:#0e1927;font-size:12px}
.npc b{color:#5ed7ff}
.muted{color:#8fa3bb;font-size:11px}
.row{display:flex;justify-content:space-between;padding:1px 0}
.mem{padding:3px 5px;background:#0a1420;border-radius:5px;margin:2px 0;font-size:11px;border-left:2px solid #3d5c80}
.social{padding:3px 5px;background:#1a0d1a;border-radius:5px;margin:2px 0;font-size:11px;border-left:2px solid #a25ba2}
.log{background:#0a1420;border-radius:8px;padding:6px;max-height:150px;overflow:auto;font-size:11px;margin-top:6px}
.log div{padding:2px 0;border-bottom:1px solid #1a2432}
#dbg{background:#0a1420;border:1px solid #5ed7ff;border-radius:8px;padding:8px;margin-top:8px;font-family:monospace;font-size:11px;color:#5ed7ff;white-space:pre-wrap;line-height:1.5}
#err{background:#300;padding:10px;margin-top:8px;font-family:monospace;font-size:12px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<h1>🐛 V6 Debug</h1>
<div>
<button id="btnRun">▶ Iniciar</button>
<button id="btnHour">+1h</button>
<button id="btnDay">+1 día</button>
<button id="btnReset" class="danger">Reiniciar</button>
</div>
<div class="info" id="clockbox">
📅 Día <b id="day">0</b> · 🕐 <b id="hour">06</b>:00 · <b id="sunicon">🌞</b> · 👥 <b id="pop">3</b> · 🌳 <b id="fruitCount">0</b>/<b id="treeCount">0</b> · 🤝 <b id="meetCount">0</b>
</div>
<canvas id="c" width="500" height="500"></canvas>
<div id="npcs"></div>
<div class="log" id="log"></div>
<div id="dbg"></div>
<div id="err"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
function dbg(msg){ if ($('dbg')) $('dbg').textContent += '\n' + msg; }

dbg('1. Script arrancó');
</script>

<script>
window.onerror = function(msg, url, line){
  var e = document.getElementById('err');
  if (e){ e.style.display = 'block'; e.textContent = 'ERROR línea ' + line + ':\n' + msg; }
  return false;
};
dbg('2. onerror listo');

try {

var W = 20;
var CELL = 25;
var FRUIT_COOLDOWN = 48;
var MEET_DISTANCE = 2;
var MEET_COOLDOWN = 6;
var S = null;
var running = false;
var timer = null;
var frame = 0;

var rand = function(a,b){ return Math.random()*(b-a)+a; };
var clamp = function(v,a,b){ return Math.max(a, Math.min(b,v)); };

dbg('3. Variables base');

function isNight(){ return S.hour >= 20 || S.hour < 6; }

function makeWorld(){
  var cells = [];
  for (var y=0; y<W; y++){
    var row = [];
    for (var x=0; x<W; x++){
      var t = 'grass';
      if (Math.sqrt((x-14)*(x-14)+(y-6)*(y-6)) < 3.5) t = 'water';
      if (Math.sqrt((x-4)*(x-4)+(y-14)*(y-14)) < 2.5) t = 'water';
      var isTree = t === 'grass' && Math.random() < 0.12;
      var shade = Math.random()*0.15 - 0.05;
      row.push({ terrain:t, tree:isTree, fruit:isTree, fruitTimer:0, shade:shade });
    }
    cells.push(row);
  }
  return { cells: cells };
}
dbg('4. makeWorld');

function cellAt(x,y){
  if (x<0 || y<0 || x>=W || y>=W) return null;
  return S.world.cells[Math.floor(y)][Math.floor(x)];
}

function makeNPC(id, name, x, y){
  return {
    id: id, name: name, x: x, y: y,
    alive: true, health: 100,
    hunger: 20 + Math.random()*20,
    thirst: 20 + Math.random()*20,
    energy: 80 + Math.random()*15,
    goal: 'explorar', reason: 'recién llegué',
    target: null, memories: [], sleeping: false,
    causeOfDeath: null,
    known: {}, rel: {}, lastMeet: {},
    shirt: ['#d95858','#5d8fd9','#5dd97f','#d9a25d','#a25dd9','#d95da2'][id % 6]
  };
}
dbg('5. makeNPC');

function logEvent(msg){
  S.events.unshift({ day:S.day, hour:S.hour, msg:msg });
  if (S.events.length > 30) S.events.pop();
}

function remember(npc, type, x, y, strength){
  for (var i=0; i<npc.memories.length; i++){
    var m = npc.memories[i];
    if (m.type===type && m.x===x && m.y===y){
      m.strength = Math.min(100, m.strength+20);
      m.day = S.day;
      return;
    }
  }
  npc.memories.unshift({ type:type, x:x, y:y, day:S.day, strength:strength||60 });
  if (npc.memories.length > 20){
    npc.memories.sort(function(a,b){ return b.strength - a.strength; });
    npc.memories = npc.memories.slice(0,20);
  }
}

function bestRecall(npc, type, minStrength){
  minStrength = minStrength || 15;
  var best = null;
  for (var i=0; i<npc.memories.length; i++){
    var m = npc.memories[i];
    if (m.type !== type) continue;
    if (m.strength < minStrength) continue;
    if (!best || m.strength > best.strength) best = m;
  }
  return best;
}

function decayMemories(npc){
  if (npc.sleeping) return;
  for (var i=npc.memories.length-1; i>=0; i--){
    var m = npc.memories[i];
    m.strength -= 0.3;
    if (m.strength <= 0) npc.memories.splice(i,1);
  }
}

function perceive(npc){
  if (npc.sleeping) return { water:null, tree:null, others:[] };
  var cx = Math.floor(npc.x), cy = Math.floor(npc.y);
  var range = isNight() ? 2 : 4;
  var seen = { water:null, tree:null, others:[] };
  for (var dy=-range; dy<=range; dy++){
    for (var dx=-range; dx<=range; dx++){
      var c = cellAt(cx+dx, cy+dy);
      if (!c) continue;
      if (c.terrain==='water' && !seen.water){
        seen.water = { x:cx+dx, y:cy+dy };
        remember(npc,'water',cx+dx,cy+dy,50);
      }
      if (c.tree && c.fruit && !seen.tree){
        seen.tree = { x:cx+dx, y:cy+dy };
        remember(npc,'tree',cx+dx,cy+dy,50);
      }
    }
  }
  for (var i=0; i<S.npcs.length; i++){
    var o = S.npcs[i];
    if (o.id === npc.id || !o.alive) continue;
    var dx2 = npc.x - o.x, dy2 = npc.y - o.y;
    if (Math.sqrt(dx2*dx2+dy2*dy2) <= range) seen.others.push(o);
  }
  return seen;
}

function checkMeetings(){
  for (var i=0; i<S.npcs.length; i++){
    var a = S.npcs[i];
    if (!a.alive || a.sleeping) continue;
    for (var j=i+1; j<S.npcs.length; j++){
      var b = S.npcs[j];
      if (!b.alive || b.sleeping) continue;
      var dx = a.x-b.x, dy = a.y-b.y;
      if (Math.sqrt(dx*dx+dy*dy) > MEET_DISTANCE) continue;
      var now = S.day*24 + S.hour;
      var lastA = a.lastMeet[b.id] || -999999;
      if (now - lastA < MEET_COOLDOWN) continue;
      a.lastMeet[b.id] = now;
      b.lastMeet[a.id] = now;
      if (!a.known[b.id]) a.known[b.id] = { count:0, lastDay:S.day };
      if (!b.known[a.id]) b.known[a.id] = { count:0, lastDay:S.day };
      a.known[b.id].count++;
      b.known[a.id].count++;
      a.rel[b.id] = clamp((a.rel[b.id]||0)+rand(-1,3), -100, 100);
      b.rel[a.id] = clamp((b.rel[a.id]||0)+rand(-1,2.5), -100, 100);
      S.meetCount = (S.meetCount||0) + 1;
      if (a.known[b.id].count === 1) logEvent('🤝 ' + a.name + ' conoció a ' + b.name);
    }
  }
}

function decide(npc, seen){
  if (isNight()) return { goal:'dormir', target:null, reason:'es de noche' };
  var hu = npc.hunger > 60, tu = npc.thirst > 60;
  if (hu && tu) return npc.hunger >= npc.thirst ? decideHunger(npc,seen) : decideThirst(npc,seen);
  if (tu) return decideThirst(npc,seen);
  if (hu) return decideHunger(npc,seen);
  if (npc.energy < 30) return { goal:'descansar', target:null, reason:'energía baja' };
  if (seen.others.length > 0 && Math.random() < 0.25){
    var other = seen.others[0];
    var k = npc.known[other.id];
    var t = k ? k.count : 0;
    return { goal:'socializar', target:{x:other.x, y:other.y}, reason: t>0 ? 'veo a '+other.name+' ('+t+')' : 'veo a '+other.name };
  }
  return { goal:'explorar', target:null, reason:'tranquilo' };
}

function decideHunger(npc, seen){
  if (seen.tree) return { goal:'comer', target:seen.tree, reason:'hambre, veo frutos' };
  var m = bestRecall(npc,'tree');
  if (m) return { goal:'comer', target:{x:m.x,y:m.y}, reason:'hambre, recuerdo ('+m.x+','+m.y+')' };
  return { goal:'explorar', target:null, reason:'hambre, sin recuerdo' };
}

function decideThirst(npc, seen){
  if (seen.water) return { goal:'beber', target:seen.water, reason:'sed, veo agua' };
  var m = bestRecall(npc,'water');
  if (m) return { goal:'beber', target:{x:m.x,y:m.y}, reason:'sed, recuerdo ('+m.x+','+m.y+')' };
  return { goal:'explorar', target:null, reason:'sed, sin recuerdo' };
}

function act(npc, d){
  npc.goal = d.goal;
  npc.reason = d.reason;
  if (d.goal === 'dormir'){
    npc.sleeping = true;
    npc.energy = clamp(npc.energy+6, 0, 100);
    return;
  }
  npc.sleeping = false;
  if (d.goal === 'descansar'){ npc.energy = clamp(npc.energy+5,0,100); return; }
  if (d.goal === 'explorar'){
    npc.x = clamp(npc.x + rand(-1,1), 0, W-1);
    npc.y = clamp(npc.y + rand(-1,1), 0, W-1);
    return;
  }
  if (d.target){
    var dx = d.target.x - npc.x, dy = d.target.y - npc.y;
    var dd = Math.sqrt(dx*dx+dy*dy);
    if (dd < 0.6){
      if (d.goal === 'beber'){
        var c = cellAt(npc.x, npc.y);
        if (c && c.terrain==='water'){ npc.thirst = 0; remember(npc,'water',Math.floor(npc.x),Math.floor(npc.y),90); }
        else {
          for (var i=0; i<npc.memories.length; i++){
            var m = npc.memories[i];
            if (m.type==='water' && Math.abs(m.x-d.target.x)<1 && Math.abs(m.y-d.target.y)<1){
              m.strength -= 25;
              if (m.strength<0) npc.memories.splice(i,1);
              break;
            }
          }
          npc.thirst = Math.max(0, npc.thirst-10);
        }
      } else if (d.goal === 'comer'){
        var c2 = cellAt(npc.x, npc.y);
        if (c2 && c2.tree && c2.fruit){
          c2.fruit = false; c2.fruitTimer = FRUIT_COOLDOWN;
          npc.hunger = 0;
          remember(npc,'tree',Math.floor(npc.x),Math.floor(npc.y),90);
        } else {
          for (var j=0; j<npc.memories.length; j++){
            var m2 = npc.memories[j];
            if (m2.type==='tree' && Math.abs(m2.x-d.target.x)<1 && Math.abs(m2.y-d.target.y)<1){
              m2.strength -= 25;
              if (m2.strength<0) npc.memories.splice(j,1);
              break;
            }
          }
          npc.hunger = Math.max(0, npc.hunger-5);
        }
      }
      npc.target = null;
      return;
    }
    npc.x = clamp(npc.x + dx/dd*0.6, 0, W-1);
    npc.y = clamp(npc.y + dy/dd*0.6, 0, W-1);
  }
}

function tickTrees(){
  for (var y=0; y<W; y++){
    for (var x=0; x<W; x++){
      var c = S.world.cells[y][x];
      if (!c.tree || c.fruit) continue;
      c.fruitTimer = (c.fruitTimer||0) - 1;
      if (c.fruitTimer <= 0){ c.fruit = true; c.fruitTimer = 0; }
    }
  }
}

function tick(){
  frame++;
  var prev = S.hour;
  S.hour++;
  if (S.hour >= 24){ S.hour = 0; S.day++; }
  if (prev === 5 && S.hour === 6){
    for (var i=0; i<S.npcs.length; i++) if (S.npcs[i].alive) S.npcs[i].sleeping = false;
  }
  tickTrees();
  for (var i=0; i<S.npcs.length; i++){
    var npc = S.npcs[i];
    if (!npc.alive) continue;
    if (npc.sleeping){
      npc.hunger = clamp(npc.hunger+0.15, 0, 100);
      npc.thirst = clamp(npc.thirst+0.2, 0, 100);
    } else {
      npc.hunger = clamp(npc.hunger+rand(0.5,0.9), 0, 100);
      npc.thirst = clamp(npc.thirst+rand(0.7,1.2), 0, 100);
      npc.energy = clamp(npc.energy-rand(0.3,0.5), 0, 100);
    }
    if (npc.hunger>=90 && npc.thirst>=90) npc.health = clamp(npc.health-0.5,0,100);
    else if (npc.hunger>=90) npc.health = clamp(npc.health-0.2,0,100);
    else if (npc.thirst>=90) npc.health = clamp(npc.health-0.3,0,100);
    else if (npc.hunger<60 && npc.thirst<60 && npc.health<100) npc.health = clamp(npc.health+0.1,0,100);
    if (npc.health <= 0){
      npc.alive = false; npc.sleeping = false;
      npc.causeOfDeath = npc.hunger>=90 ? 'inanición' : npc.thirst>=90 ? 'deshidratación' : 'enfermedad';
      logEvent('⚰️ ' + npc.name + ' murió (' + npc.causeOfDeath + ')');
      continue;
    }
    decayMemories(npc);
    var seen = perceive(npc);
    var decision = decide(npc, seen);
    act(npc, decision);
  }
  checkMeetings();
  render();
}

function render(){
  $('day').textContent = S.day;
  $('hour').textContent = String(S.hour).padStart(2,'0');
  var alive = 0;
  for (var i=0; i<S.npcs.length; i++) if (S.npcs[i].alive) alive++;
  $('pop').textContent = alive;
  var night = isNight();
  $('sunicon').textContent = night ? '🌙' : '🌞';
  var fc = 0, tc = 0;
  for (var y=0; y<W; y++) for (var x=0; x<W; x++){
    var c = S.world.cells[y][x];
    if (!c.tree) continue;
    tc++;
    if (c.fruit) fc++;
  }
  $('fruitCount').textContent = fc;
  $('treeCount').textContent = tc;
  $('meetCount').textContent = S.meetCount || 0;
  draw();
  renderNpcList();
  renderLog();
}

function draw(){
  var canvas = $('c');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  var night = isNight();

  for (var y=0; y<W; y++){
    for (var x=0; x<W; x++){
      var c = S.world.cells[y][x];
      var px = x*CELL, py = y*CELL;
      if (c.terrain === 'water'){
        ctx.fillStyle = '#2c6aa0';
        ctx.fillRect(px, py, CELL, CELL);
      } else {
        var base = Math.floor(58 + c.shade*60);
        ctx.fillStyle = 'rgb(' + Math.floor(base*0.55) + ',' + Math.floor(base+20) + ',' + Math.floor(base*0.65) + ')';
        ctx.fillRect(px, py, CELL, CELL);
      }
    }
  }

  for (var y=0; y<W; y++){
    for (var x=0; x<W; x++){
      var c = S.world.cells[y][x];
      if (!c.tree) continue;
      var cx = x*CELL + CELL/2, cy = y*CELL + CELL/2;
      ctx.fillStyle = '#5a3d24';
      ctx.fillRect(cx-2, cy-2, 4, 9);
      ctx.fillStyle = c.fruit ? '#2d7a3a' : '#3d5f3a';
      ctx.beginPath();
      ctx.arc(cx, cy-6, 8, 0, Math.PI*2);
      ctx.fill();
      if (c.fruit){
        ctx.fillStyle = '#d94a4a';
        ctx.beginPath();
        ctx.arc(cx-3, cy-8, 1.5, 0, Math.PI*2);
        ctx.arc(cx+3, cy-5, 1.5, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  if (night){
    ctx.fillStyle = 'rgba(10,20,60,0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  for (var i=0; i<S.npcs.length; i++){
    var a = S.npcs[i];
    if (!a.alive) continue;
    for (var j=i+1; j<S.npcs.length; j++){
      var b = S.npcs[j];
      if (!b.alive) continue;
      var dx = a.x-b.x, dy = a.y-b.y;
      if (Math.sqrt(dx*dx+dy*dy) <= 3 && a.rel[b.id] !== undefined){
        var trust = a.rel[b.id];
        var alpha = Math.min(0.5, Math.max(0.15, (trust+100)/300));
        ctx.strokeStyle = trust > 30 ? 'rgba(120,220,120,'+alpha+')' : trust < -30 ? 'rgba(220,120,120,'+alpha+')' : 'rgba(200,200,200,'+alpha+')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(a.x*CELL+CELL/2, a.y*CELL+CELL/2);
        ctx.lineTo(b.x*CELL+CELL/2, b.y*CELL+CELL/2);
        ctx.stroke();
      }
    }
  }

  for (var k=0; k<S.npcs.length; k++){
    var npc = S.npcs[k];
    if (!npc.alive) continue;
    var px = npc.x*CELL + CELL/2, py = npc.y*CELL + CELL/2;
    var bob = Math.sin(frame*0.3 + npc.id) * 0.5;

    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(px, py+10, 7, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = npc.shirt;
    ctx.fillRect(px-5, py-1+bob, 10, 9);

    ctx.fillStyle = '#e8c39e';
    ctx.beginPath();
    ctx.arc(px, py-6+bob, 4.5, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#3a2a1a';
    ctx.beginPath();
    ctx.arc(px, py-7+bob, 4.5, Math.PI, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#000';
    ctx.font = 'bold 7px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(npc.name[0], px, py-6+bob);

    var icon = null;
    if (npc.sleeping) icon = '💤';
    else if (npc.health < 50) icon = '❤️';
    else if (npc.thirst > 75) icon = '💧';
    else if (npc.hunger > 75) icon = '🍽️';
    if (icon){
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(icon, px, py-16);
    }
  }
}

function renderNpcList(){
  var html = '';
  for (var i=0; i<S.npcs.length; i++){
    var n = S.npcs[i];
    var cls = 'npc';
    if (!n.alive) cls += ' dead';
    html += '<div class="' + cls + '">';
    html += '<b>' + n.name + '</b>';
    if (!n.alive) html += ' <span class="muted">⚰️</span>';
    else if (n.sleeping) html += ' <span class="muted">💤</span>';
    html += ' <span class="muted">(' + n.x.toFixed(1) + ',' + n.y.toFixed(1) + ')</span>';
    if (n.alive){
      html += '<div class="row"><span>❤️</span><b>' + Math.round(n.health) + '</b></div>';
      html += '<div class="row"><span>🍽️</span><b>' + Math.round(n.hunger) + '</b></div>';
      html += '<div class="row"><span>💧</span><b>' + Math.round(n.thirst) + '</b></div>';
      html += '<div class="row"><span>⚡</span><b>' + Math.round(n.energy) + '</b></div>';
      html += '<div class="row"><span>🎯 ' + n.goal + '</span></div>';
    }
    html += '</div>';
  }
  $('npcs').innerHTML = html;
}

function renderLog(){
  var html = '';
  for (var i=0; i<Math.min(8, S.events.length); i++){
    var e = S.events[i];
    html += '<div>D ' + e.day + ' ' + String(e.hour).padStart(2,'0') + ' · ' + e.msg + '</div>';
  }
  $('log').innerHTML = html || '<div class="muted">Sin eventos.</div>';
}

function reset(){
  dbg('6. reset() inicio');
  S = {
    day:0, hour:6,
    world: makeWorld(),
    npcs: [
      makeNPC(1, 'Ana', 3, 3),
      makeNPC(2, 'Bruno', 16, 3),
      makeNPC(3, 'Cira', 10, 16)
    ],
    events: [], meetCount: 0
  };
  dbg('7. NPCs creados');
  render();
  dbg('8. render() ejecutado ✅ TODO OK');
}

$('btnRun').onclick = function(){
  if (running){ running = false; clearInterval(timer); timer = null; $('btnRun').textContent = '▶ Iniciar'; }
  else { running = true; $('btnRun').textContent = '⏸ Pausar'; timer = setInterval(tick, 500); }
};
$('btnHour').onclick = function(){ if (!running) { tick(); } };
$('btnDay').onclick = function(){ if (!running) { for (var i=0; i<24; i++) tick(); } };
$('btnReset').onclick = function(){ if (running){ clearInterval(timer); timer = null; running = false; $('btnRun').textContent = '▶ Iniciar'; } reset(); };

dbg('9. Handlers listos. Ejecutando reset()...');
reset();

} catch(e) {
  dbg('❌ EXCEPCIÓN: ' + e.message);
  var errDiv = document.getElementById('err');
  if (errDiv){ errDiv.style.display = 'block'; errDiv.textContent = 'Excepción capturada:\n' + e.message + '\n\nStack:\n' + (e.stack || 'sin stack'); }
}
</script>
