<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test</title>
<style>
body{background:#0b1118;color:#fff;padding:10px;font-family:system-ui;font-size:16px}
canvas{background:#111;display:block;width:100%;max-width:400px;margin:10px auto;border-radius:8px}
#status{font-weight:bold;font-size:18px;color:#5ed7ff;margin:10px 0}
#err{background:#300;padding:10px;margin-top:10px;font-family:monospace;font-size:13px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<h1>🧪 Test de canvas</h1>
<div id="status">Iniciando…</div>
<canvas id="c" width="400" height="400"></canvas>
<div id="err"></div>

<script>
var $ = function(id){ return document.getElementById(id); };

window.onerror = function(msg, url, line){
  var e = $('err');
  e.style.display = 'block';
  e.textContent = 'ERROR línea ' + line + ':\n\n' + msg;
  return false;
};

$('status').textContent = '1. Script arrancó';
$('status').textContent = '2. Error handler listo';

var c = $('c');
var ctx = c.getContext('2d');
$('status').textContent = '3. Canvas obtenido';

ctx.fillStyle = '#3a6f3a';
ctx.fillRect(0, 0, 400, 400);
$('status').textContent = '4. Fondo verde dibujado';

ctx.fillStyle = '#2c6aa0';
ctx.beginPath();
ctx.arc(200, 200, 80, 0, Math.PI * 2);
ctx.fill();
$('status').textContent = '5. Círculo azul dibujado';

ctx.fillStyle = '#d95858';
ctx.fillRect(50, 50, 60, 60);
$('status').textContent = '6. Cuadrado rojo dibujado';

ctx.font = '30px sans-serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('💧', 300, 100);
$('status').textContent = '7. Emoji dibujado ✅ TODO OK';
</script>
</body>
</html>
