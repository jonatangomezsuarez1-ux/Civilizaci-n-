<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civilización V7.3</title>
<style>
body{background:#0b1118;color:#e8eef7;font-family:system-ui;padding:10px;font-size:14px;margin:0}
h1{font-size:18px;margin:6px 0}
button{padding:10px 14px;font-size:15px;margin:3px;background:#1a2b40;color:#fff;border:1px solid #2c4666;border-radius:10px;cursor:pointer}
button.danger{background:#4a1e26}
canvas{background:#111;display:block;width:100%;max-width:500px;margin:10px auto;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.info{background:#111c2a;border:1px solid #22344a;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
.info.night{background:#0d1324;border-color:#2a3a5a}
.npc{padding:9px;border:1px solid #22344a;border-radius:10px;margin:6px 0;background:#0e1927}
.npc.sleeping{background:#0d1224}
.npc b{color:#5ed7ff}
.muted{color:#8fa3bb;font-size:12px}
.row{display:flex;justify-content:space-between;padding:2px 0}
.social{padding:4px 6px;background:#1a0d1a;border-radius:6px;margin:3px 0;font-size:11px;border-left:2px solid #a25ba2}
.log{background:#0a1420;border-radius:10px;padding:8px;max-height:150px;overflow:auto;font-size:12px;margin-top:8px}
.log div{padding:3px 0;border-bottom:1px solid #1a2432}
.log div:last-child{border-bottom:none}
</style>
</head>
<body>
<h1>🌎 Civilización V7.3 — Encuentros</h1>
<div>
<button id="btnRun">▶ Iniciar</button>
<button id="btnHour">+1 hora</button>
<button id="btnDay">+1 día</button>
<button id="btnReset" class="danger">Reiniciar</button>
</div>
<div class="info" id="clockbox">
📅 Día <b id="day">0</b> · 🕐 <b id="hour">06</b> <b id="sunicon">🌞</b> · 👥 <b id="pop">3</b> · 🌳 <b id="trees">0</b> · 🤝 <b id="meetCount">0</b>
</div>
<canvas id="c" width="500" height="500"></canvas>
<div id="npcs"></div>
<div class="log" id="log"></div>

<script>
var W = 20;
var CELL = 25;
var MEET_DISTANCE = 2;
var MEET_COOLDOWN = 6;
var S = null;
var running = false;
var timer = null;
var frame = 0;
var stars = [];
var $ = function(id){ return document.getElementById(id); };

function rand(a,b){ return Math.random()*(b-a)+a; }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function dist(a,b){ return Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y)); }
function isNight(){ return S.hour >= 20 || S.hour < 6; }

function initStars(){
  stars = [];
  for (var i=0; i<60; i++){
    stars.push({ x: Math.random()*500, y: Math.random()*300, size: Math.random()*1.5+0.5, phase: Math.random()*Math.PI*2 });
  }
}

function makeWorld(){
  var cells = [];
  for (var y=0; y<W; y++){
    var row = [];
    for (var x=0; x<W; x++){
      var t = 'grass';
      if (dist({x:x,y:y}, {x:14,y:6}) < 3.5) t = 'water';
      if (dist({x:x,y:y}, {x:4,y:14}) < 2.5) t = 'water';
      var isTree = (t === 'grass') && Math.random() < 0.12;
      var treeType = 0;
      if (isTree){
        var r = Math.random();
        treeType = r < 0.4 ? 0 : r < 0.75 ? 1 : 2;
      }
      var shade = Math.random()*0.12 - 0.04;
      var flowerSeed = Math.random();
      row.push({ terrain:t, tree:isTree, fruit:isTree, treeType:treeType, shade:shade, flower: flowerSeed });
    }
    cells.push(row);
  }
  return { cells: cells };
}

function cellAt(x,y){
  if (x<0 || y<0 || x>=W || y>=W) return null;
  return S.world.cells[Math.floor(y)][Math.floor(x)];
}

function isWater(x,y){
  var c = cellAt(x,y);
  return c && c.terrain === 'water';
}

function makeNPC(id, name, x, y){
  return {
    id: id, name: name,
    x: x, y: y,
    hunger: 20, thirst: 20, energy: 90, health: 100,
    goal: 'explorar', reason: 'nuevo',
    target: null, sleeping: false,
    shirt: ['#d95858','#5d8fd9','#5dd97f','#d9a25d','#a25dd9','#d95da2'][id % 6],
    hair: ['#3a2a1a','#5a3a1a','#2a1a0a','#7a5a3a'][id % 4],
    // Capa social
    known: {},       // { npcId: { count, lastDay } }
    rel: {},         // { npcId: trust -100..100 }
    lastMeet: {}     // { npcId: hour absolute }
  };
}

// ============ LOG DE EVENTOS ============
function logEvent(msg){
  S.events.unshift({ day:S.day, hour:S.hour, msg:msg });
  if (S.events.length > 40) S.events.pop();
}

// ============ ENCUENTROS ============
function checkMeetings(){
  for (var i=0; i<S.npcs.length; i++){
    var a = S.npcs[i];
    if (!a.alive && a.alive !== undefined) continue;
    if (a.sleeping) continue;
    for (var j=i+1; j<S.npcs.length; j++){
      var b = S.npcs[j];
      if (b.sleeping) continue;
      var d = dist(a, b);
      if (d > MEET_DISTANCE) continue;
      var now = S.day * 24 + S.hour;
      var lastA = a.lastMeet[b.id] || -999999;
      if (now - lastA < MEET_COOLDOWN) continue;
      a.lastMeet[b.id] = now;
      b.lastMeet[a.id] = now;

      // Registrar encuentro
      if (!a.known[b.id]) a.known[b.id] = { count:0, lastDay:S.day };
      if (!b.known[a.id]) b.known[a.id] = { count:0, lastDay:S.day };
      a.known[b.id].count++;
      a.known[b.id].lastDay = S.day;
      b.known[a.id].count++;
      b.known[a.id].lastDay = S.day;

      // Ajustar confianza (asimétrica: cada uno sube distinto)
      a.rel[b.id] = clamp((a.rel[b.id] || 0) + rand(-1, 3), -100, 100);
      b.rel[a.id] = clamp((b.rel[a.id] || 0) + rand(-1, 2.5), -100, 100);

      S.meetCount = (S.meetCount || 0) + 1;

      if (a.known[b.id].count === 1){
        logEvent('🤝 ' + a.name + ' conoció a ' + b.name);
      }
    }
  }
}

// ============ IA base ============
function perceive(npc){
  if (npc.sleeping) return { water:null, tree:null };
  var cx = Math.floor(npc.x), cy = Math.floor(npc.y);
  var range = isNight() ? 2 : 4;
  var water = null, tree = null;
  for (var dy=-range; dy<=range; dy++){
    for (var dx=-range; dx<=range; dx++){
      var c = cellAt(cx+dx, cy+dy);
      if (!c) continue;
      if (c.terrain === 'water' && !water) water = { x:cx+dx, y:cy+dy };
      if (c.tree && c.fruit && !tree) tree = { x:cx+dx, y:cy+dy };
    }
  }
  return { water: water, tree: tree };
}

function decide(npc, seen){
  if (isNight()) return { goal:'dormir', target:null, reason:'es de noche' };
  if (npc.thirst > 60 && seen.water) return { goal:'beber', target:seen.water, reason:'sed, veo agua' };
  if (npc.hunger > 60 && seen.tree) return { goal:'comer', target:seen.tree, reason:'hambre, veo fruta' };
  if (npc.energy < 30) return { goal:'descansar', target:null, reason:'cansado' };
  return { goal:'explorar', target:null, reason:'tranquilo' };
}

function act(npc, d){
  npc.goal = d.goal;
  npc.reason = d.reason;
  if (d.goal === 'dormir'){ npc.sleeping = true; npc.energy = clamp(npc.energy+5,0,100); return; }
  npc.sleeping = false;
  if (d.goal === 'descansar'){ npc.energy = clamp(npc.energy+5,0,100); return; }
  if (d.goal === 'explorar'){
    var nx = clamp(npc.x + rand(-1,1), 0, W-1);
    var ny = clamp(npc.y + rand(-1,1), 0, W-1);
    if (!isWater(Math.floor(nx), Math.floor(ny))){
      npc.x = nx;
      npc.y = ny;
    }
    return;
  }
  if (d.target){
    var dx = d.target.x - npc.x;
    var dy = d.target.y - npc.y;
    var dd = Math.sqrt(dx*dx+dy*dy);
    if (dd < 0.6){
      if (d.goal === 'beber'){
        npc.thirst = 0;
        if (isWater(Math.floor(npc.x), Math.floor(npc.y))){
          var cx2 = Math.floor(npc.x), cy2 = Math.floor(npc.y);
          var dirs = [[-1,0],[1,0],[0,-1],[0,1]];
          for (var k=0; k<dirs.length; k++){
            var tx = cx2 + dirs[k][0], ty = cy2 + dirs[k][1];
            if (!isWater(tx, ty)){
              npc.x = tx + 0.5;
              npc.y = ty + 0.5;
              break;
            }
          }
        }
      }
      else if (d.goal === 'comer'){
        var c = cellAt(npc.x, npc.y);
        if (c && c.tree && c.fruit){ c.fruit = false; npc.hunger = 0; }
      }
      npc.target = null;
      return;
    }
    var nx2 = clamp(npc.x + dx/dd*0.6, 0, W-1);
    var ny2 = clamp(npc.y + dy/dd*0.6, 0, W-1);
    if (d.goal === 'beber' || !isWater(Math.floor(nx2), Math.floor(ny2))){
      npc.x = nx2;
      npc.y = ny2;
    }
  }
}

function tick(){
  frame++;
  var prev = S.hour;
  S.hour++;
  if (S.hour >= 24){ S.hour = 0; S.day++; }
  if (prev === 5 && S.hour === 6){
    for (var i=0; i<S.npcs.length; i++) S.npcs[i].sleeping = false;
  }
  for (var i=0; i<S.npcs.length; i++){
    var npc = S.npcs[i];
    if (npc.sleeping){
      npc.hunger = clamp(npc.hunger+0.15, 0, 100);
      npc.thirst = clamp(npc.thirst+0.2, 0, 100);
    } else {
      npc.hunger = clamp(npc.hunger+rand(0.5,0.9), 0, 100);
      npc.thirst = clamp(npc.thirst+rand(0.7,1.2), 0, 100);
      npc.energy = clamp(npc.energy-rand(0.3,0.5), 0, 100);
    }
    var seen = perceive(npc);
    var d = decide(npc, seen);
    act(npc, d);
  }
  checkMeetings();
  render();
}

function render(){
  $('day').textContent = S.day;
  $('hour').textContent = String(S.hour).padStart(2,'0');
  $('sunicon').textContent = isNight() ? '🌙' : '🌞';
  $('clockbox').className = isNight() ? 'info night' : 'info';
  $('pop').textContent = S.npcs.length;
  $('meetCount').textContent = S.meetCount || 0;
  var tc = 0;
  for (var y=0; y<W; y++) for (var x=0; x<W; x++){
    if (S.world.cells[y][x].tree) tc++;
  }
  $('trees').textContent = tc;
  draw();
  renderList();
  renderLog();
}

// ==================== DIBUJO ====================
function draw(){
  var c = $('c');
  var ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  var night = isNight();
  var t = frame * 0.15;

  for (var y=0; y<W; y++){
    for (var x=0; x<W; x++){
      var cell = S.world.cells[y][x];
      var px = x*CELL, py = y*CELL;

      if (cell.terrain === 'water'){
        var grad = ctx.createLinearGradient(px, py, px, py+CELL);
        grad.addColorStop(0, '#3a7eb0');
        grad.addColorStop(1, '#245a80');
        ctx.fillStyle = grad;
        ctx.fillRect(px, py, CELL, CELL);
        ctx.strokeStyle = 'rgba(150, 200, 240, 0.35)';
        ctx.lineWidth = 1;
        var wy = py + 13 + Math.sin(t + x*0.4 + y*0.3) * 1.5;
        ctx.beginPath();
        ctx.moveTo(px+5, wy);
        ctx.quadraticCurveTo(px+CELL/2, wy-2, px+CELL-5, wy);
        ctx.stroke();
      } else {
        var base = Math.floor(58 + cell.shade*60);
        ctx.fillStyle = 'rgb(' + Math.floor(base*0.55) + ',' + Math.floor(base+18) + ',' + Math.floor(base*0.65) + ')';
        ctx.fillRect(px, py, CELL, CELL);
        if ((x + y) % 2 === 0){
          ctx.strokeStyle = 'rgba(50, 90, 45, 0.5)';
          ctx.lineWidth = 1;
          for (var i=0; i<2; i++){
            var bx = px + 6 + i*11;
            var by = py + 20;
            var sway = Math.sin(t*0.4 + bx*0.15 + y) * 1.2;
            ctx.beginPath();
            ctx.moveTo(bx, by);
            ctx.lineTo(bx + sway, by - 4);
            ctx.stroke();
          }
        }
        if (cell.flower > 0.93){
          ctx.fillStyle = cell.flower > 0.97 ? '#ffd94a' : '#ff7ba6';
          ctx.beginPath();
          ctx.arc(px + 18, py + 8, 1.8, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
  }

  // Borde agua/tierra
  ctx.strokeStyle = 'rgba(180, 220, 255, 0.5)';
  ctx.lineWidth = 1.5;
  for (var y=0; y<W; y++){
    for (var x=0; x<W; x++){
      if (!isWater(x,y)) continue;
      var px = x*CELL, py = y*CELL;
      if (!isWater(x-1,y)){ ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py+CELL); ctx.stroke(); }
      if (!isWater(x+1,y)){ ctx.beginPath(); ctx.moveTo(px+CELL, py); ctx.lineTo(px+CELL, py+CELL); ctx.stroke(); }
      if (!isWater(x,y-1)){ ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px+CELL, py); ctx.stroke(); }
      if (!isWater(x,y+1)){ ctx.beginPath(); ctx.moveTo(px, py+CELL); ctx.lineTo(px+CELL, py+CELL); ctx.stroke(); }
    }
  }

  // Árboles
  for (var y=0; y<W; y++){
    for (var x=0; x<W; x++){
      var cell = S.world.cells[y][x];
      if (!cell.tree) continue;
      drawTree(ctx, x, y, cell);
    }
  }

  // Línea de objetivo
  for (var i=0; i<S.npcs.length; i++){
    var npc = S.npcs[i];
    if (!npc.target || npc.sleeping) continue;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.setLineDash([4,4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(npc.x*CELL+CELL/2, npc.y*CELL+CELL/2);
    ctx.lineTo(npc.target.x*CELL+CELL/2, npc.target.y*CELL+CELL/2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // LÍNEAS SOCIALES entre NPCs cercanos que se conocen
  for (var i=0; i<S.npcs.length; i++){
    var a = S.npcs[i];
    for (var j=i+1; j<S.npcs.length; j++){
      var b = S.npcs[j];
      var d = dist(a, b);
      if (d > 3) continue;
      if (a.rel[b.id] === undefined) continue;
      var trust = a.rel[b.id];
      var alpha = Math.min(0.55, Math.max(0.15, (trust + 100) / 300));
      var color;
      if (trust > 30) color = 'rgba(120, 220, 120, ' + alpha + ')';
      else if (trust < -30) color = 'rgba(220, 120, 120, ' + alpha + ')';
      else color = 'rgba(200, 200, 200, ' + alpha + ')';
      ctx.strokeStyle = color;
      ctx.lineWidth = 1 + Math.abs(trust) / 100;
      ctx.beginPath();
      ctx.moveTo(a.x*CELL+CELL/2, a.y*CELL+CELL/2);
      ctx.lineTo(b.x*CELL+CELL/2, b.y*CELL+CELL/2);
      ctx.stroke();
    }
  }

  // NPCs
  for (var i=0; i<S.npcs.length; i++){
    drawNPC(ctx, S.npcs[i], night);
  }

  // Noche
  if (night){
    for (var i=0; i<stars.length; i++){
      var s = stars[i];
      var alpha = 0.3 + Math.sin(frame*0.05 + s.phase) * 0.3;
      ctx.fillStyle = 'rgba(255, 255, 255, ' + alpha + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(10, 20, 60, 0.35)';
    ctx.fillRect(0, 0, c.width, c.height);
  }
}

function drawTree(ctx, x, y, cell){
  var cx = x*CELL + CELL/2;
  var cy = y*CELL + CELL/2;
  var type = cell.treeType || 0;

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.arc(cx, cy+9, 9, 0, Math.PI*2);
  ctx.fill();

  if (type === 0){
    ctx.fillStyle = '#5a3d24';
    ctx.fillRect(cx-2, cy-2, 4, 10);
    ctx.fillStyle = '#7a5534';
    ctx.fillRect(cx-2, cy-2, 2, 10);
    var leafDark = cell.fruit ? '#1d6a2a' : '#2e4a30';
    var leafLight = cell.fruit ? '#3d9a4a' : '#456b47';
    ctx.fillStyle = leafDark;
    ctx.beginPath();
    ctx.arc(cx, cy-7, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = leafLight;
    ctx.beginPath();
    ctx.arc(cx-4, cy-9, 5, 0, Math.PI*2);
    ctx.arc(cx+5, cy-7, 4, 0, Math.PI*2);
    ctx.fill();
  } else if (type === 1){
    ctx.fillStyle = '#5a3d24';
    ctx.fillRect(cx-1.5, cy+2, 3, 8);
    var pineDark = cell.fruit ? '#1a5a28' : '#244a2a';
    var pineLight = cell.fruit ? '#2d8a3d' : '#3a6b40';
    ctx.fillStyle = pineDark;
    ctx.beginPath();
    ctx.moveTo(cx, cy-14);
    ctx.lineTo(cx-8, cy+4);
    ctx.lineTo(cx+8, cy+4);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = pineLight;
    ctx.beginPath();
    ctx.moveTo(cx, cy-13);
    ctx.lineTo(cx-5, cy-1);
    ctx.lineTo(cx+5, cy-1);
    ctx.closePath();
    ctx.fill();
  } else {
    var bushDark = cell.fruit ? '#1d6a2a' : '#2e5030';
    var bushLight = cell.fruit ? '#3d9a4a' : '#4a754c';
    ctx.fillStyle = bushDark;
    ctx.beginPath();
    ctx.arc(cx-3, cy+2, 6, 0, Math.PI*2);
    ctx.arc(cx+4, cy+3, 5, 0, Math.PI*2);
    ctx.arc(cx+1, cy-2, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = bushLight;
    ctx.beginPath();
    ctx.arc(cx-1, cy-3, 3, 0, Math.PI*2);
    ctx.fill();
  }

  if (cell.fruit && type !== 2){
    ctx.fillStyle = '#e63e3e';
    ctx.beginPath();
    ctx.arc(cx-4, cy-8, 1.8, 0, Math.PI*2);
    ctx.arc(cx+3, cy-6, 1.8, 0, Math.PI*2);
    ctx.arc(cx+1, cy-11, 1.8, 0, Math.PI*2);
    ctx.fill();
  } else if (cell.fruit && type === 2){
    ctx.fillStyle = '#e63e3e';
    ctx.beginPath();
    ctx.arc(cx-2, cy, 1.5, 0, Math.PI*2);
    ctx.arc(cx+4, cy+2, 1.5, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawNPC(ctx, npc, night){
  var px = npc.x*CELL + CELL/2;
  var py = npc.y*CELL + CELL/2;
  var cell = cellAt(npc.x, npc.y);
  var inWater = cell && cell.terrain === 'water';
  var bob = Math.sin(frame*0.3 + npc.id) * 0.6;
  var walking = (npc.goal === 'explorar' && !npc.sleeping) || (npc.target && !npc.sleeping);
  var legSwing = walking ? Math.sin(frame*0.4 + npc.id) * 3 : 0;
  var waterLine = py + 4;

  if (!inWater){
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.arc(px, py+15, 10, 0, Math.PI*2);
    ctx.fill();
  }

  if (!inWater){
    ctx.strokeStyle = '#2a2a3a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px-3, py+9);
    ctx.lineTo(px-3+legSwing, py+15);
    ctx.moveTo(px+3, py+9);
    ctx.lineTo(px+3-legSwing, py+15);
    ctx.stroke();
  }

  ctx.fillStyle = npc.sleeping ? '#6a6a7a' : npc.shirt;
  ctx.fillRect(px-7, py-1+bob, 14, 12);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(px+3, py-1+bob, 4, 12);

  ctx.fillStyle = '#e8c39e';
  ctx.beginPath();
  ctx.arc(px, py-9+bob, 6.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = npc.hair;
  ctx.beginPath();
  ctx.arc(px, py-10.5+bob, 6.5, Math.PI, Math.PI*2);
  ctx.fill();

  if (inWater){
    var wGrad = ctx.createLinearGradient(px, waterLine, px, py+15);
    wGrad.addColorStop(0, 'rgba(58, 126, 176, 0.85)');
    wGrad.addColorStop(1, 'rgba(36, 90, 128, 0.95)');
    ctx.fillStyle = wGrad;
    ctx.fillRect(px-14, waterLine, 28, 20);

    ctx.strokeStyle = 'rgba(200, 230, 255, 0.7)';
    ctx.lineWidth = 1.5;
    var waveR = 8 + Math.sin(frame*0.15 + npc.id) * 2;
    ctx.beginPath();
    ctx.ellipse(px, waterLine, waveR, 3, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200, 230, 255, 0.4)';
    ctx.beginPath();
    ctx.ellipse(px, waterLine, waveR+4, 4, 0, 0, Math.PI*2);
    ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var nameY = py + 18;
  ctx.strokeText(npc.name, px, nameY);
  ctx.fillText(npc.name, px, nameY);

  var barW = 24, barH = 3;
  var barX = px - barW/2;
  var barY = py - 22 + bob;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(barX-1, barY-1, barW+2, barH+2);
  var hp = npc.health / 100;
  var barColor = hp > 0.6 ? '#4ade80' : hp > 0.3 ? '#facc15' : '#ef4444';
  ctx.fillStyle = barColor;
  ctx.fillRect(barX, barY, barW * hp, barH);

  var icon = null;
  if (npc.sleeping) icon = '💤';
  else if (inWater) icon = '🌊';
  else if (npc.health < 50) icon = '❤️';
  else if (npc.thirst > 75) icon = '💧';
  else if (npc.hunger > 75) icon = '🍽️';

  if (icon){
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var iconY = py - 30 + Math.sin(frame*0.2 + npc.id) * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(icon, px+0.5, iconY+0.5);
    ctx.fillStyle = '#fff';
    ctx.fillText(icon, px, iconY);
  }
}
