<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civilización V3 — Noche y sueño</title>
<style>
body{margin:0;background:#0b1118;color:#e8eef7;font-family:system-ui;padding:10px;font-size:14px}
h1{font-size:18px;margin:6px 0}
button{padding:9px 13px;font-size:14px;margin:3px;background:#1a2b40;color:#fff;border:1px solid #2c4666;border-radius:10px;cursor:pointer}
button.danger{background:#4a1e26}
canvas{background:#111;display:block;width:100%;max-width:420px;margin:10px auto;border-radius:10px;image-rendering:pixelated}
.info{background:#111c2a;border:1px solid #22344a;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}
.info.night{background:#0d1324;border-color:#2a3a5a}
.npc{padding:8px;border:1px solid #22344a;border-radius:10px;margin:6px 0;background:#0e1927}
.npc.sleeping{background:#0d1224;border-color:#2a3a5a}
.npc b{color:#5ed7ff}
.npc.sleeping b{color:#a5c8ff}
.muted{color:#8fa3bb;font-size:12px}
.row{display:flex;justify-content:space-between;padding:2px 0}
.mem{padding:4px 6px;background:#0a1420;border-radius:6px;margin:3px 0;font-size:11px;border-left:2px solid #3d5c80}
.mem.fresh{border-left-color:#5ed7ff}
.mem.old{border-left-color:#555;opacity:.6}
</style>
</head>
<body>
<h1>🌎 Civilización V3 — Noche y sueño</h1>
<div>
<button id="btnRun">▶ Iniciar</button>
<button id="btnHour">+1 hora</button>
<button id="btnDay">+1 día</button>
<button id="btnReset" class="danger">Reiniciar</button>
</div>
<div class="info" id="clockbox">
📅 Día <b id="day">0</b> · 🕐 <b id="hour">06</b>:00 · <b id="sunicon">🌞</b> <span id="daypart">día</span> · 👥 <b id="pop">3</b>
</div>
<canvas id="c" width="400" height="400"></canvas>
<div id="npcs"></div>

<script>
var W = 20;
var CELL = 20;
var S = null;
var running = false;
var timer = null;
var $ = function(id){ return document.getElementById(id); };

function rand(a, b){ return Math.random() * (b - a) + a; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

// Noche de 20:00 a 6:00
function isNight(){
  return S.hour >= 20 || S.hour < 6;
}

function makeWorld(){
  var cells = [];
  for (var y = 0; y < W; y++){
    var row = [];
    for (var x = 0; x < W; x++){
      var t = 'grass';
      if (Math.hypot(x - 14, y - 6) < 3.5) t = 'water';
      if (Math.hypot(x - 4, y - 14) < 2.5) t = 'water';
      var isTree = t === 'grass' && Math.random() < 0.12;
      row.push({ terrain: t, tree: isTree, fruit: isTree });
    }
    cells.push(row);
  }
  return { cells: cells };
}

function cellAt(x, y){
  if (x < 0 || y < 0 || x >= W || y >= W) return null;
  return S.world.cells[Math.floor(y)][Math.floor(x)];
}

function makeNPC(id, name, x, y){
  return {
    id: id,
    name: name,
    x: x,
    y: y,
    hunger: 20 + Math.random() * 20,
    thirst: 20 + Math.random() * 20,
    energy: 80 + Math.random() * 15,
    goal: 'explorar',
    reason: 'recién llegué',
    target: null,
    memories: [],
    sleeping: false
  };
}

// ==================== MEMORIA ====================
function remember(npc, type, x, y, strength){
  for (var i = 0; i < npc.memories.length; i++){
    var m = npc.memories[i];
    if (m.type === type && m.x === x && m.y === y){
      m.strength = Math.min(100, m.strength + 20);
      m.day = S.day;
      return;
    }
  }
  npc.memories.unshift({ type: type, x: x, y: y, day: S.day, strength: strength || 60 });
  if (npc.memories.length > 20){
    npc.memories.sort(function(a, b){ return b.strength - a.strength; });
    npc.memories = npc.memories.slice(0, 20);
  }
}

function bestRecall(npc, type, minStrength){
  minStrength = minStrength || 15;
  var best = null;
  for (var i = 0; i < npc.memories.length; i++){
    var m = npc.memories[i];
    if (m.type !== type) continue;
    if (m.strength < minStrength) continue;
    if (!best || m.strength > best.strength) best = m;
  }
  return best;
}

function decayMemories(npc){
  // De noche los recuerdos NO se debilitan (el sueño refuerza)
  if (npc.sleeping) return;
  for (var i = npc.memories.length - 1; i >= 0; i--){
    var m = npc.memories[i];
    m.strength -= 0.3;
    if (m.strength <= 0) npc.memories.splice(i, 1);
  }
}

// ==================== PERCEPCIÓN ====================
function perceive(npc){
  // De noche percibe menos
  if (npc.sleeping) return { water: null, tree: null };
  var cx = Math.floor(npc.x);
  var cy = Math.floor(npc.y);
  var range = isNight() ? 2 : 4;
  var seen = { water: null, tree: null };
  for (var dy = -range; dy <= range; dy++){
    for (var dx = -range; dx <= range; dx++){
      var c = cellAt(cx + dx, cy + dy);
      if (!c) continue;
      if (c.terrain === 'water' && !seen.water){
        seen.water = { x: cx + dx, y: cy + dy };
        remember(npc, 'water', cx + dx, cy + dy, 50);
      }
      if (c.tree && c.fruit && !seen.tree){
        seen.tree = { x: cx + dx, y: cy + dy };
        remember(npc, 'tree', cx + dx, cy + dy, 50);
      }
    }
  }
  return seen;
}

// ==================== DECISIÓN ====================
function decide(npc, seen){
  // Prioridad máxima: si es de noche, dormir
  if (isNight()){
    return { goal: 'dormir', target: null, reason: 'es de noche', source: 'night' };
  }
  if (npc.thirst > 60){
    if (seen.water){
      return { goal: 'beber', target: seen.water, reason: 'sed alta, veo agua', source: 'seen' };
    }
    var memW = bestRecall(npc, 'water');
    if (memW){
      return { goal: 'beber', target: { x: memW.x, y: memW.y }, reason: 'sed alta, recuerdo agua en (' + memW.x + ',' + memW.y + ')', source: 'memory' };
    }
    return { goal: 'explorar', target: null, reason: 'sed alta, no recuerdo agua', source: null };
  }
  if (npc.hunger > 60){
    if (seen.tree){
      return { goal: 'comer', target: seen.tree, reason: 'hambre alta, veo frutos', source: 'seen' };
    }
    var memT = bestRecall(npc, 'tree');
    if (memT){
      return { goal: 'comer', target: { x: memT.x, y: memT.y }, reason: 'hambre alta, recuerdo frutos en (' + memT.x + ',' + memT.y + ')', source: 'memory' };
    }
    return { goal: 'explorar', target: null, reason: 'hambre alta, no recuerdo frutos', source: null };
  }
  if (npc.energy < 30){
    return { goal: 'descansar', target: null, reason: 'energía baja', source: null };
  }
  return { goal: 'explorar', target: null, reason: 'tranquilo', source: null };
}

// ==================== ACCIÓN ====================
function act(npc, decision){
  npc.goal = decision.goal;
  npc.reason = decision.reason;

  if (decision.goal === 'dormir'){
    npc.sleeping = true;
    npc.energy = clamp(npc.energy + 6, 0, 100);
    return;
  }

  npc.sleeping = false;

  if (decision.goal === 'descansar'){
    npc.energy = clamp(npc.energy + 5, 0, 100);
    return;
  }

  if (decision.goal === 'explorar'){
    npc.x = clamp(npc.x + rand(-1, 1), 0, W - 1);
    npc.y = clamp(npc.y + rand(-1, 1), 0, W - 1);
    return;
  }

  if (decision.target){
    var dx = decision.target.x - npc.x;
    var dy = decision.target.y - npc.y;
    var d = Math.hypot(dx, dy);

    if (d < 0.6){
      if (decision.goal === 'beber'){
        var c = cellAt(npc.x, npc.y);
        if (c && c.terrain === 'water'){
          npc.thirst = 0;
          remember(npc, 'water', Math.floor(npc.x), Math.floor(npc.y), 90);
        } else {
          for (var i = 0; i < npc.memories.length; i++){
            var m = npc.memories[i];
            if (m.type === 'water' && Math.abs(m.x - decision.target.x) < 1 && Math.abs(m.y - decision.target.y) < 1){
              m.strength -= 25;
              if (m.strength < 0) npc.memories.splice(i, 1);
              break;
            }
          }
          npc.thirst = Math.max(0, npc.thirst - 10);
        }
      } else if (decision.goal === 'comer'){
        var c2 = cellAt(npc.x, npc.y);
        if (c2 && c2.tree && c2.fruit){
          c2.fruit = false;
          npc.hunger = 0;
          remember(npc, 'tree', Math.floor(npc.x), Math.floor(npc.y), 90);
        } else {
          for (var j = 0; j < npc.memories.length; j++){
            var m2 = npc.memories[j];
            if (m2.type === 'tree' && Math.abs(m2.x - decision.target.x) < 1 && Math.abs(m2.y - decision.target.y) < 1){
              m2.strength -= 25;
              if (m2.strength < 0) npc.memories.splice(j, 1);
              break;
            }
          }
          npc.hunger = Math.max(0, npc.hunger - 5);
        }
      }
      npc.target = null;
      return;
    }

    npc.x = clamp(npc.x + dx / d * 0.6, 0, W - 1);
    npc.y = clamp(npc.y + dy / d * 0.6, 0, W - 1);
  }
}

// ==================== TICK ====================
function tick(){
  var prevHour = S.hour;
  S.hour++;
  if (S.hour >= 24){
    S.hour = 0;
    S.day++;
  }
  // Al amanecer, despertar a todos
  if (prevHour === 5 && S.hour === 6){
    for (var i = 0; i < S.npcs.length; i++){
      S.npcs[i].sleeping = false;
    }
  }

  for (var i = 0; i < S.npcs.length; i++){
    var npc = S.npcs[i];

    // Necesidades
    if (npc.sleeping){
      // Mientras duerme: hambre y sed suben más lento, energía recuperada en act()
      npc.hunger = clamp(npc.hunger + 0.15, 0, 100);
      npc.thirst = clamp(npc.thirst + 0.2, 0, 100);
    } else {
      npc.hunger = clamp(npc.hunger + rand(0.5, 0.9), 0, 100);
      npc.thirst = clamp(npc.thirst + rand(0.7, 1.2), 0, 100);
      npc.energy = clamp(npc.energy - rand(0.3, 0.5), 0, 100);
    }

    decayMemories(npc);

    var seen = perceive(npc);
    var decision = decide(npc, seen);
    act(npc, decision);
  }

  render();
}

function advance(hours){
  if (running) return;
  for (var i = 0; i < hours; i++) tick();
  render();
}

function render(){
  $('day').textContent = S.day;
  $('hour').textContent = String(S.hour).padStart(2, '0');
  $('pop').textContent = S.npcs.length;

  var night = isNight();
  $('sunicon').textContent = night ? '🌙' : '🌞';
  $('daypart').textContent = night ? 'noche' : 'día';
  $('clockbox').className = night ? 'info night' : 'info';

  draw();
  renderNpcList();
}

function draw(){
  var canvas = $('c');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (var y = 0; y < W; y++){
    for (var x = 0; x < W; x++){
      var c = S.world.cells[y][x];
      var color = '#3a6f3a';
      if (c.terrain === 'water') color = '#2c6aa0';
      if (c.tree) color = c.fruit ? '#1d5c2c' : '#264a2c';
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
    }
  }

  // Tinte de noche
  if (isNight()){
    ctx.fillStyle = 'rgba(10, 20, 60, 0.45)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  for (var i = 0; i < S.npcs.length; i++){
    var npc = S.npcs[i];
    if (npc.target && !npc.sleeping){
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(npc.x * CELL + CELL / 2, npc.y * CELL + CELL / 2);
      ctx.lineTo(npc.target.x * CELL + CELL / 2, npc.target.y * CELL + CELL / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Los que duermen se ven más apagados
    ctx.fillStyle = npc.sleeping ? '#a5a8b0' : '#f5e6a8';
    ctx.beginPath();
    ctx.arc(npc.x * CELL + CELL / 2, npc.y * CELL + CELL / 2, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(npc.name[0], npc.x * CELL + CELL / 2, npc.y * CELL + CELL / 2);
  }
}

function renderNpcList(){
  var html = '';
  for (var i = 0; i < S.npcs.length; i++){
    var n = S.npcs[i];
    var cls = n.sleeping ? 'npc sleeping' : 'npc';
    html += '<div class="' + cls + '">';
    html += '<b>' + n.name + '</b>';
    if (n.sleeping) html += ' <span class="muted">💤 durmiendo</span>';
    html += ' <span class="muted">(' + n.x.toFixed(1) + ', ' + n.y.toFixed(1) + ')</span>';
    html += '<div class="row"><span>🍽️ Hambre</span><b>' + Math.round(n.hunger) + '</b></div>';
    html += '<div class="row"><span>💧 Sed</span><b>' + Math.round(n.thirst) + '</b></div>';
    html += '<div class="row"><span>⚡ Energía</span><b>' + Math.round(n.energy) + '</b></div>';
    html += '<div class="row"><span>🎯 ' + n.goal + '</span><span class="muted">' + n.reason + '</span></div>';
    if (n.memories.length > 0){
      html += '<div class="muted" style="margin-top:6px">Recuerdos (' + n.memories.length + '):</div>';
      var sorted = n.memories.slice().sort(function(a, b){ return b.strength - a.strength; });
      for (var j = 0; j < Math.min(5, sorted.length); j++){
        var m = sorted[j];
        var mcls = m.strength > 50 ? 'mem fresh' : m.strength < 25 ? 'mem old' : 'mem';
        var icon = m.type === 'water' ? '💧' : '🌳';
        html += '<div class="' + mcls + '">' + icon + ' (' + m.x + ',' + m.y + ') · fuerza ' + Math.round(m.strength) + '</div>';
      }
    } else {
      html += '<div class="muted" style="margin-top:6px">Sin recuerdos.</div>';
    }
    html += '</div>';
  }
  $('npcs').innerHTML = html;
}

function reset(){
  S = {
    day: 0,
    hour: 6,
    world: makeWorld(),
    npcs: [
      makeNPC(1, 'Ana', 3, 3),
      makeNPC(2, 'Bruno', 16, 3),
      makeNPC(3, 'Cira', 10, 16)
    ]
  };
  render();
}

$('btnRun').onclick = function(){
  if (running){
    running = false;
    clearInterval(timer);
    timer = null;
    $('btnRun').textContent = '▶ Iniciar';
  } else {
    running = true;
    $('btnRun').textContent = '⏸ Pausar';
    timer = setInterval(tick, 500);
  }
};

$('btnHour').onclick = function(){ advance(1); };
$('btnDay').onclick = function(){ advance(24); };
$('btnReset').onclick = function(){
  if (running){
    clearInterval(timer);
    timer = null;
    running = false;
    $('btnRun').textContent = '▶ Iniciar';
  }
  reset();
};

reset();
</script>
</body>
</html>
