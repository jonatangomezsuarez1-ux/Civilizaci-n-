<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civilización V6</title>
<style>
body{margin:0;background:#0b1118;color:#e8eef7;font-family:system-ui;padding:10px;font-size:14px}
h1{font-size:18px;margin:6px 0}
button{padding:9px 13px;font-size:14px;margin:3px;background:#1a2b40;color:#fff;border:1px solid #2c4666;border-radius:10px;cursor:pointer}
button.danger{background:#4a1e26}
canvas{background:#111;display:block;width:100%;max-width:600px;margin:10px auto;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.info{background:#111c2a;border:1px solid #22344a;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}
.info.night{background:#0d1324;border-color:#2a3a5a}
.npc{padding:8px;border:1px solid #22344a;border-radius:10px;margin:6px 0;background:#0e1927}
.npc.sleeping{background:#0d1224;border-color:#2a3a5a}
.npc.dead{opacity:0.4;background:#1a0d0d;border-color:#3a2020}
.npc b{color:#5ed7ff}
.npc.sleeping b{color:#a5c8ff}
.npc.dead b{color:#9eacc2}
.muted{color:#8fa3bb;font-size:12px}
.row{display:flex;justify-content:space-between;padding:2px 0}
.mem{padding:4px 6px;background:#0a1420;border-radius:6px;margin:3px 0;font-size:11px;border-left:2px solid #3d5c80}
.mem.fresh{border-left-color:#5ed7ff}
.mem.old{border-left-color:#555;opacity:.6}
.social{padding:4px 6px;background:#1a0d1a;border-radius:6px;margin:3px 0;font-size:11px;border-left:2px solid #a25ba2}
.log{background:#0a1420;border-radius:10px;padding:8px;max-height:180px;overflow:auto;font-size:12px;margin-top:8px}
.log div{padding:3px 0;border-bottom:1px solid #1a2432}
.log div:last-child{border-bottom:none}
#err{position:fixed;inset:0;background:#300;color:#fff;padding:20px;font-family:monospace;font-size:13px;display:none;z-index:999;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<h1>🌎 Civilización V6</h1>
<div>
<button id="btnRun">▶ Iniciar</button>
<button id="btnHour">+1 hora</button>
<button id="btnDay">+1 día</button>
<button id="btnReset" class="danger">Reiniciar</button>
</div>
<div class="info" id="clockbox">
📅 Día <b id="day">0</b> · 🕐 <b id="hour">06</b>:00 · <b id="sunicon">🌞</b> <span id="daypart">día</span> · 👥 <b id="pop">3</b> · 🌳 <b id="fruitCount">0</b>/<b id="treeCount">0</b> · 🤝 <b id="meetCount">0</b>
</div>
<canvas id="c" width="600" height="600"></canvas>
<div id="npcs"></div>
<div class="log" id="log"></div>
<div id="err"></div>

<script>
// ===== CAZADOR DE ERRORES =====
window.onerror = function(msg, url, line, col){
  var e = document.getElementById('err');
  if (e){
    e.style.display = 'block';
    e.innerHTML = '<b>ERROR EN LÍNEA ' + line + ':</b>\n\n' + msg + '\n\nCopia este mensaje y mándalo.';
  }
  return false;
};

var W = 20;
var CELL = 30;
var FRUIT_COOLDOWN = 48;
var MEET_DISTANCE = 2;
var MEET_COOLDOWN = 6;
var S = null;
var running = false;
var timer = null;
var frame = 0;
var $ = function(id){ return document.getElementById(id); };

function rand(a, b){ return Math.random() * (b - a) + a; }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function isNight(){
  return S.hour >= 20 || S.hour < 6;
}

function makeWorld(){
  var cells = [];
  for (var y = 0; y < W; y++){
    var row = [];
    for (var x = 0; x < W; x++){
      var t = 'grass';
      if (Math.hypot(x - 14, y - 6) < 3.5) t = 'water';
      if (Math.hypot(x - 4, y - 14) < 2.5) t = 'water';
      var isTree = t === 'grass' && Math.random() < 0.12;
      var shade = Math.random() * 0.15 - 0.05;
      row.push({ terrain: t, tree: isTree, fruit: isTree, fruitTimer: 0, shade: shade });
    }
    cells.push(row);
  }
  return { cells: cells };
}

function cellAt(x, y){
  if (x < 0 || y < 0 || x >= W || y >= W) return null;
  return S.world.cells[Math.floor(y)][Math.floor(x)];
}

function makeNPC(id, name, x, y){
  return {
    id: id,
    name: name,
    x: x,
    y: y,
    alive: true,
    health: 100,
    hunger: 20 + Math.random() * 20,
    thirst: 20 + Math.random() * 20,
    energy: 80 + Math.random() * 15,
    goal: 'explorar',
    reason: 'recién llegué',
    target: null,
    memories: [],
    sleeping: false,
    causeOfDeath: null,
    known: {},
    rel: {},
    lastMeet: {},
    shirt: ['#d95858', '#5d8fd9', '#5dd97f', '#d9a25d', '#a25dd9', '#d95da2'][id % 6]
  };
}

function logEvent(msg){
  S.events.unshift({ day: S.day, hour: S.hour, msg: msg });
  if (S.events.length > 30) S.events.pop();
}

// ===== MEMORIA =====
function remember(npc, type, x, y, strength){
  for (var i = 0; i < npc.memories.length; i++){
    var m = npc.memories[i];
    if (m.type === type && m.x === x && m.y === y){
      m.strength = Math.min(100, m.strength + 20);
      m.day = S.day;
      return;
    }
  }
  npc.memories.unshift({ type: type, x: x, y: y, day: S.day, strength: strength || 60 });
  if (npc.memories.length > 20){
    npc.memories.sort(function(a, b){ return b.strength - a.strength; });
    npc.memories = npc.memories.slice(0, 20);
  }
}

function bestRecall(npc, type, minStrength){
  minStrength = minStrength || 15;
  var best = null;
  for (var i = 0; i < npc.memories.length; i++){
    var m = npc.memories[i];
    if (m.type !== type) continue;
    if (m.strength < minStrength) continue;
    if (!best || m.strength > best.strength) best = m;
  }
  return best;
}

function decayMemories(npc){
  if (npc.sleeping) return;
  for (var i = npc.memories.length - 1; i >= 0; i--){
    var m = npc.memories[i];
    m.strength -= 0.3;
    if (m.strength <= 0) npc.memories.splice(i, 1);
  }
}

// ===== PERCEPCIÓN =====
function perceive(npc){
  if (npc.sleeping) return { water: null, tree: null, others: [] };
  var cx = Math.floor(npc.x);
  var cy = Math.floor(npc.y);
  var range = isNight() ? 2 : 4;
  var seen = { water: null, tree: null, others: [] };
  for (var dy = -range; dy <= range; dy++){
    for (var dx = -range; dx <= range; dx++){
      var c = cellAt(cx + dx, cy + dy);
      if (!c) continue;
      if (c.terrain === 'water' && !seen.water){
        seen.water = { x: cx + dx, y: cy + dy };
        remember(npc, 'water', cx + dx, cy + dy, 50);
      }
      if (c.tree && c.fruit && !seen.tree){
        seen.tree = { x: cx + dx, y: cy + dy };
        remember(npc, 'tree', cx + dx, cy + dy, 50);
      }
    }
  }
  for (var i = 0; i < S.npcs.length; i++){
    var o = S.npcs[i];
    if (o.id === npc.id || !o.alive) continue;
    if (Math.hypot(npc.x - o.x, npc.y - o.y) <= range){
      seen.others.push(o);
    }
  }
  return seen;
}

// ===== ENCUENTROS =====
function checkMeetings(){
  for (var i = 0; i < S.npcs.length; i++){
    var a = S.npcs[i];
    if (!a.alive || a.sleeping) continue;
    for (var j = i + 1; j < S.npcs.length; j++){
      var b = S.npcs[j];
      if (!b.alive || b.sleeping) continue;
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d > MEET_DISTANCE) continue;
      var now = S.day * 24 + S.hour;
      var lastA = a.lastMeet[b.id] || -999999;
      if (now - lastA < MEET_COOLDOWN) continue;
      a.lastMeet[b.id] = now;
      b.lastMeet[a.id] = now;
      if (!a.known[b.id]) a.known[b.id] = { count: 0, lastDay: S.day };
      if (!b.known[a.id]) b.known[a.id] = { count: 0, lastDay: S.day };
      a.known[b.id].count++;
      a.known[b.id].lastDay = S.day;
      b.known[a.id].count++;
      b.known[a.id].lastDay = S.day;
      a.rel[b.id] = clamp((a.rel[b.id] || 0) + rand(-1, 3), -100, 100);
      b.rel[a.id] = clamp((b.rel[a.id] || 0) + rand(-1, 2.5), -100, 100);
      S.meetCount = (S.meetCount || 0) + 1;
      if (a.known[b.id].count === 1){
        logEvent('🤝 ' + a.name + ' conoció a ' + b.name);
      }
    }
  }
}

// ===== DECISIÓN =====
function decide(npc, seen){
  if (isNight()){
    return { goal: 'dormir', target: null, reason: 'es de noche' };
  }
  var hungerUrgent = npc.hunger > 60;
  var thirstUrgent = npc.thirst > 60;
  if (hungerUrgent && thirstUrgent){
    if (npc.hunger >= npc.thirst) return decideHunger(npc, seen);
    return decideThirst(npc, seen);
  }
  if (thirstUrgent) return decideThirst(npc, seen);
  if (hungerUrgent) return decideHunger(npc, seen);
  if (npc.energy < 30){
    return { goal: 'descansar', target: null, reason: 'energía baja' };
  }
  if (seen.others.length > 0 && Math.random() < 0.25){
    var other = seen.others[0];
    var known = npc.known[other.id];
    var times = known ? known.count : 0;
    return {
      goal: 'socializar',
      target: { x: other.x, y: other.y },
      reason: times > 0 ? 'veo a ' + other.name + ' (' + times + ')' : 'veo a ' + other.name
    };
  }
  return { goal: 'explorar', target: null, reason: 'tranquilo' };
}

function decideHunger(npc, seen){
  if (seen.tree) return { goal: 'comer', target: seen.tree, reason: 'hambre alta, veo frutos' };
  var memT = bestRecall(npc, 'tree');
  if (memT) return { goal: 'comer', target: { x: memT.x, y: memT.y }, reason: 'hambre alta, recuerdo frutos en (' + memT.x + ',' + memT.y + ')' };
  return { goal: 'explorar', target: null, reason: 'hambre alta, sin recuerdo' };
}

function decideThirst(npc, seen){
  if (seen.water) return { goal: 'beber', target: seen.water, reason: 'sed alta, veo agua' };
  var memW = bestRecall(npc, 'water');
  if (memW) return { goal: 'beber', target: { x: memW.x, y: memW.y }, reason: 'sed alta, recuerdo agua en (' + memW.x + ',' + memW.y + ')' };
  return { goal: 'explorar', target: null, reason: 'sed alta, sin recuerdo' };
}

// ===== ACCIÓN =====
function act(npc, decision){
  npc.goal = decision.goal;
  npc.reason = decision.reason;
  if (decision.goal === 'dormir'){
    npc.sleeping = true;
    npc.energy = clamp(npc.energy + 6, 0, 100);
    return;
  }
  npc.sleeping = false;
  if (decision.goal === 'descansar'){
    npc.energy = clamp(npc.energy + 5, 0, 100);
    return;
  }
  if (decision.goal === 'explorar'){
    npc.x = clamp(npc.x + rand(-1, 1), 0, W - 1);
    npc.y = clamp(npc.y + rand(-1, 1), 0, W - 1);
    return;
  }
  if (decision.target){
    var dx = decision.target.x - npc.x;
    var dy = decision.target.y - npc.y;
    var d = Math.hypot(dx, dy);
    if (d < 0.6){
      if (decision.goal === 'beber'){
        var c = cellAt(npc.x, npc.y);
        if (c && c.terrain === 'water'){
          npc.thirst = 0;
          remember(npc, 'water', Math.floor(npc.x), Math.floor(npc.y), 90);
        } else {
          for (var i = 0; i < npc.memories.length; i++){
            var m = npc.memories[i];
            if (m.type === 'water' && Math.abs(m.x - decision.target.x) < 1 && Math.abs(m.y - decision.target.y) < 1){
              m.strength -= 25;
              if (m.strength < 0) npc.memories.splice(i, 1);
              break;
            }
          }
          npc.thirst = Math.max(0, npc.thirst - 10);
        }
      } else if (decision.goal === 'comer'){
        var c2 = cellAt(npc.x, npc.y);
        if (c2 && c2.tree && c2.fruit){
          c2.fruit = false;
          c2.fruitTimer = FRUIT_COOLDOWN;
          npc.hunger = 0;
          remember(npc, 'tree', Math.floor(npc.x), Math.floor(npc.y), 90);
        } else {
          for (var j = 0; j < npc.memories.length; j++){
            var m2 = npc.memories[j];
            if (m2.type === 'tree' && Math.abs(m2.x - decision.target.x) < 1 && Math.abs(m2.y - decision.target.y) < 1){
              m2.strength -= 25;
              if (m2.strength < 0) npc.memories.splice(j, 1);
              break;
            }
          }
          npc.hunger = Math.max(0, npc.hunger - 5);
        }
      }
      npc.target = null;
      return;
    }
    npc.x = clamp(npc.x + dx / d * 0.6, 0, W - 1);
    npc.y = clamp(npc.y + dy / d * 0.6, 0, W - 1);
  }
}

// ===== ÁRBOLES =====
function tickTrees(){
  for (var y = 0; y < W; y++){
    for (var x = 0; x < W; x++){
      var c = S.world.cells[y][x];
      if (!c.tree) continue;
      if (c.fruit) continue;
      c.fruitTimer = (c.fruitTimer || 0) - 1;
      if (c.fruitTimer <= 0){
        c.fruit = true;
        c.fruitTimer = 0;
      }
    }
  }
}

// ===== TICK =====
function tick(){
  frame++;
  var prevHour = S.hour;
  S.hour++;
  if (S.hour >= 24){
    S.hour = 0;
    S.day++;
  }
  if (prevHour === 5 && S.hour === 6){
    for (var i = 0; i < S.npcs.length; i++){
      if (S.npcs[i].alive) S.npcs[i].sleeping = false;
    }
  }
  tickTrees();
  for (var i = 0; i < S.npcs.length; i++){
    var npc = S.npcs[i];
    if (!npc.alive) continue;
    if (npc.sleeping){
      npc.hunger = clamp(npc.hunger + 0.15, 0, 100);
      npc.thirst = clamp(npc.thirst + 0.2, 0, 100);
    } else {
      npc.hunger = clamp(npc.hunger + rand(0.5, 0.9), 0, 100);
      npc.thirst = clamp(npc.thirst + rand(0.7, 1.2), 0, 100);
      npc.energy = clamp(npc.energy - rand(0.3, 0.5), 0, 100);
    }
    if (npc.hunger >= 90 && npc.thirst >= 90) npc.health = clamp(npc.health - 0.5, 0, 100);
    else if (npc.hunger >= 90) npc.health = clamp(npc.health - 0.2, 0, 100);
    else if (npc.thirst >= 90) npc.health = clamp(npc.health - 0.3, 0, 100);
    else if (npc.hunger < 60 && npc.thirst < 60 && npc.health < 100) npc.health = clamp(npc.health + 0.1, 0, 100);
    if (npc.health <= 0){
      npc.alive = false;
      npc.sleeping = false;
      npc.causeOfDeath = npc.hunger >= 90 ? 'inanición' : npc.thirst >= 90 ? 'deshidratación' : 'enfermedad';
      logEvent('⚰️ ' + npc.name + ' murió (' + npc.causeOfDeath + ')');
      continue;
    }
    decayMemories(npc);
    var seen = perceive(npc);
    var decision = decide(npc, seen);
    act(npc, decision);
  }
  checkMeetings();
  render();
}

function advance(hours){
  if (running) return;
  for (var i = 0; i < hours; i++) tick();
  render();
}

// ===== RENDER =====
function render(){
  $('day').textContent = S.day;
  $('hour').textContent = String(S.hour).padStart(2, '0');
  var alive = 0;
  for (var i = 0; i < S.npcs.length; i++) if (S.npcs[i].alive) alive++;
  $('pop').textContent = alive;
  var night = isNight();
  $('sunicon').textContent = night ? '🌙' : '🌞';
  $('daypart').textContent = night ? 'noche' : 'día';
  $('clockbox').className = night ? 'info night' : 'info';
  var fruitTrees = 0, totalTrees = 0;
  for (var y = 0; y < W; y++){
    for (var x = 0; x < W; x++){
      var c = S.world.cells[y][x];
      if (!c.tree) continue;
      totalTrees++;
      if (c.fruit) fruitTrees++;
    }
  }
  $('fruitCount').textContent = fruitTrees;
  $('treeCount').textContent = totalTrees;
  $('meetCount').textContent = S.meetCount || 0;
  draw();
  renderNpcList();
  renderLog();
}

function draw(){
  var canvas = $('c');
  var ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  var night = isNight();
  var t = frame * 0.15;

  // Suelo
  for (var y = 0; y < W; y++){
    for (var x = 0; x < W; x++){
      var c = S.world.cells[y][x];
      var px = x * CELL;
      var py = y * CELL;

      if (c.terrain === 'water'){
        var grad = ctx.createLinearGradient(px, py, px, py + CELL);
        grad.addColorStop(0, '#3a7eb0');
        grad.addColorStop(1, '#2a5a80');
        ctx.fillStyle = grad;
        ctx.fillRect(px, py, CELL, CELL);

        ctx.strokeStyle = 'rgba(120, 180, 220, 0.4)';
        ctx.lineWidth = 1;
        for (var k = 0; k < 2; k++){
          var wy = py + 8 + k * 14 + Math.sin(t + x * 0.5 + y * 0.3 + k) * 2;
          ctx.beginPath();
          ctx.moveTo(px + 4, wy);
          ctx.quadraticCurveTo(px + CELL / 2, wy - 3, px + CELL - 4, wy);
          ctx.stroke();
        }
      } else {
        var base = Math.floor(58 + c.shade * 60);
        ctx.fillStyle = 'rgb(' + Math.floor(base * 0.55) + ',' + Math.floor(base + 20) + ',' + Math.floor(base * 0.65) + ')';
        ctx.fillRect(px, py, CELL, CELL);

        ctx.strokeStyle = 'rgba(60, 100, 50, 0.5)';
        ctx.lineWidth = 1;
        for (var i = 0; i < 3; i++){
          var bx = px + 5 + i * 8 + ((x * 7 + y * 11) % 4);
          var by = py + 20;
          var sway = Math.sin(t * 0.5 + bx * 0.1) * 1.5;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + sway, by - 6);
          ctx.stroke();
        }
      }
    }
  }

  // Árboles
  for (var y = 0; y < W; y++){
    for (var x = 0; x < W; x++){
      var c = S.world.cells[y][x];
      if (!c.tree) continue;
      var cx = x * CELL + CELL / 2;
      var cy = y * CELL + CELL / 2;
      var treeTop = cy - 6;

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.arc(cx, cy + 9, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#5a3d24';
      ctx.fillRect(cx - 2, cy - 2, 4, 11);
      ctx.fillStyle = '#7a5534';
      ctx.fillRect(cx - 2, cy - 2, 2, 11);

      var leafMain = c.fruit ? '#2d7a3a' : '#3d5f3a';
      var leafLight = c.fruit ? '#3d9a4a' : '#507a4a';
      ctx.fillStyle = leafMain;
      ctx.beginPath();
      ctx.arc(cx, treeTop - 2, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = leafLight;
      ctx.beginPath();
      ctx.arc(cx - 3, treeTop - 5, 6, 0, Math.PI * 2);
      ctx.arc(cx + 4, treeTop - 3, 5, 0, Math.PI * 2);
      ctx.fill();

      if (c.fruit){
        ctx.fillStyle = '#d94a4a';
        ctx.beginPath();
        ctx.arc(cx - 4, treeTop - 3, 1.5, 0, Math.PI * 2);
        ctx.arc(cx + 3, treeTop - 6, 1.5, 0, Math.PI * 2);
        ctx.arc(cx + 1, treeTop + 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Noche
  if (night){
    ctx.fillStyle = 'rgba(10, 20, 60, 0.5)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Líneas sociales
  for (var i = 0; i < S.npcs.length; i++){
    var a = S.npcs[i];
    if (!a.alive) continue;
    for (var j = i + 1; j < S.npcs.length; j++){
      var b = S.npcs[j];
      if (!b.alive) continue;
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d <= 3 && a.rel[b.id] !== undefined){
        var trust = a.rel[b.id];
        var alpha = Math.min(0.5, Math.max(0.15, (trust + 100) / 300));
        var color = trust > 30 ? 'rgba(120, 220, 120, ' + alpha + ')' : trust < -30 ? 'rgba(220, 120, 120, ' + alpha + ')' : 'rgba(200, 200, 200, ' + alpha + ')';
        ctx.strokeStyle = color;
        ctx.lineWidth = 1 + Math.abs(trust) / 100;
        ctx.beginPath();
        ctx.moveTo(a.x * CELL + CELL / 2, a.y * CELL + CELL / 2);
        ctx.lineTo(b.x * CELL + CELL / 2, b.y * CELL + CELL / 2);
        ctx.stroke();
      }
    }
  }

  // Línea de objetivo
  for (var k = 0; k < S.npcs.length; k++){
    var npc = S.npcs[k];
    if (!npc.alive || npc.sleeping || !npc.target) continue;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(npc.x * CELL + CELL / 2, npc.y * CELL + CELL / 2);
